<script>
    /* =========================
       1. PRELOADER OVERLAY LAYER CONTROL
    ========================== */
    window.addEventListener("load", () => {
        const curtain = document.getElementById("loading-curtain");
        const logo = document.getElementById("curtain-logo");

        // Bring up minimal text system tag
        setTimeout(() => {
            if (logo) logo.classList.remove('opacity-0');
        }, 150);

        // Hide text slightly before removing mask
        setTimeout(() => {
            if (logo) logo.classList.add('opacity-0');
        }, 850);

        // Smooth dissolve to regular background content
        setTimeout(() => {
            if (curtain) curtain.classList.add('opacity-0');
        }, 1200);

        // Evict element node from processing thread completely
        setTimeout(() => {
            if (curtain) curtain.remove();
        }, 2200);
    });

    /* =========================
       2. INTERSECTION OBSERVER FOR CARDS
    ========================== */
    document.addEventListener("DOMContentLoaded", () => {
        const fadeElements = document.querySelectorAll(".scroll-fade-in");

        const scrollObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Wipe styling tracking classes to trigger modern utility values
                    entry.target.style.opacity = "1";
                    entry.target.style.transform = "translateY(0)";
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: "0px 0px -40px 0px"
        });

        fadeElements.forEach(el => scrollObserver.observe(el));
    });

    /* =========================
       3. UI CONTROLS (NAV & THEME)
    ========================== */
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const themeBtn = document.getElementById('theme-btn');
    let isOpen = false;

    // Initialize state icons contextually on initial window build
    if (document.documentElement.classList.contains('dark')) {
        themeBtn.innerHTML = '☀️';
    } else {
        themeBtn.innerHTML = '🌙';
    }

    menuBtn.addEventListener('click', () => {
        isOpen = !isOpen;
        if (isOpen) {
            mobileMenu.classList.remove('max-h-0');
            mobileMenu.classList.add('max-h-96');
            menuBtn.innerHTML = '✖';
        } else {
            mobileMenu.classList.remove('max-h-96');
            mobileMenu.classList.add('max-h-0');
            menuBtn.innerHTML = '☰';
        }
    });

    themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        html.classList.toggle('dark');

        if (html.classList.contains('dark')) {
            themeBtn.innerHTML = '☀️';
            localStorage.setItem('theme', 'dark');
        } else {
            themeBtn.innerHTML = '🌙';
            localStorage.setItem('theme', 'light');
        }
    });
</script>
